<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
        }

        header {
            background: #111;
            padding: 20px 30px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1200px;
            margin: 0 auto;
            padding-bottom: 20px;
        }

        nav img {
            width: 90px;
            height: 90px;
            object-fit: cover;
            border-radius: 12px;
        }

        nav ol {
            display: flex;
            align-items: center;
            gap: 30px;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            font-size: 1.1rem;
        }

        nav button {
            background: #fff;
            color: #111;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
        }

        main {
            padding: 30px 0 0;
        }

        .hero {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 40px;
            padding: 20px 30px 40px;
        }

        .hero h1 {
            font-size: 3rem;
            margin: 0 0 15px;
        }

        .hero p {
            margin: 0 0 20px;
            color: #ddd;
            font-size: 1.1rem;
        }

        .hero button {
            background: #f5f5f5;
            color: #111;
            border: none;
            padding: 12px 22px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
        }

        .products img {
            width: 520px;
            height: 420px;
            object-fit: cover;
            border-radius: 12px;
        }

        .gallery-section {
            background: #111;
            padding: 0 20px 40px;
        }

        .gallery-grid {
            max-width: 1600px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1.26fr 2fr;
            gap: 30px;
            align-items: stretch;
        }

        .gallery-side {
            display: grid;
            grid-template-rows: 1fr 1fr;
            gap: 30px;
        }

        .gallery-row {
            display: grid;
            gap: 30px;
        }

        .gallery-row.top {
            grid-template-columns: repeat(2, 1fr);
        }

        .gallery-row.bottom {
            grid-template-columns: repeat(3, 1fr);
        }

        .image-card {
            background-color: #0a0a0a;
            background-size: cover;
            background-position: center;
            border: 3px solid #f3f3f3;
            min-height: 270px;
            min-width: 0;
            overflow: hidden;
        }

        .image-card.large {
            min-height: 570px;
        }

        @media (max-width: 900px) {
            .hero {
                flex-direction: column;
                text-align: center;
            }

            .products img {
                width: 100%;
                max-width: 520px;
            }

            .gallery-grid {
                grid-template-columns: 1fr;
            }

            .image-card.large {
                min-height: 320px;
            }
        }

        @media (max-width: 560px) {
            nav {
                flex-direction: column;
                gap: 20px;
            }

            nav ol {
                flex-wrap: wrap;
                justify-content: center;
            }

            .gallery-grid {
                grid-template-columns: 1fr;
            }

            .gallery-side,
            .gallery-row.top,
            .gallery-row.bottom {
                grid-template-columns: 1fr;
                grid-template-rows: auto;
            }
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <div>
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=200&q=80" alt="Logo shoe">
            </div>
            <div>
                <ol>
                    <li><a href="#">Home</a></li>
                    <li><a href="#">About</a></li>
                    <li><a href="#">Service</a></li>
                    <li><button>Contact</button></li>
                </ol>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div>
                <h1>This is a heading</h1>
                <p>Lorem ipsum dolor sit amet</p>
                <button>Learn more</button>
            </div>

            <div class="products">
                <img src="https://images.unsplash.com/photo-1551488831-00ddcb6c6bd3?w=800&q=80" alt="Clothes and shoes">
            </div>
        </section>
    </main>

    <section class="gallery-section">
        <div class="gallery-grid">
            <div class="image-card large" style="background-image: url('https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=1000&q=80');"></div>
            <div class="gallery-side">
                <div class="gallery-row top">
                    <div class="image-card" style="background-image: url('https://images.unsplash.com/photo-1525966222134-fcfa99b8ae77?auto=format&fit=crop&w=900&q=80');"></div>
                    <div class="image-card" style="background-image: url('https://images.unsplash.com/photo-1543508282-6319a3e2621f?auto=format&fit=crop&w=900&q=80');"></div>
                </div>
                <div class="gallery-row bottom">
                    <div class="image-card" style="background-image: url('https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?auto=format&fit=crop&w=900&q=80');"></div>
                    <div class="image-card" style="background-image: url('https://images.unsplash.com/photo-1608231387042-66d1773070a5?auto=format&fit=crop&w=900&q=80');"></div>
                    <div class="image-card" style="background-image: url('https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?auto=format&fit=crop&w=900&q=80');"></div>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
